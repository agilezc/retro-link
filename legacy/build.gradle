plugins { id 'com.android.application' }
android {
 namespace 'org.retrolink.legacy'
 compileSdk 35
 defaultConfig { applicationId 'org.retrolink.legacy'; minSdk 9; targetSdk 28; versionCode 48; versionName '1.0.0' }
 // Sideload-only Android 2.3 companion; no Google Play distribution.
 lint { disable 'ExpiredTargetSdkVersion' }
 compileOptions { sourceCompatibility JavaVersion.VERSION_1_8; targetCompatibility JavaVersion.VERSION_1_8 }
 buildTypes { release { minifyEnabled false } }
}
